<title>창작물 현황</title>
<style>
:root{--bg:#f6f3ee;--box:#fcfcfb;--line:#e4dfd6;--text:#1d1b18;--sub:#57534c;--accent:#b5562f;--accent-2:#9a4524;--err:#c4302b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--box:#1c1c1a;--line:#2f2e2a;--text:#f0efec;--sub:#c3c2b7;--accent:#e5865c;--accent-2:#f09a72;--err:#f07a74;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
.box{background:var(--box);border:1px solid var(--line);border-radius:14px;padding:30px 26px;width:320px;max-width:100%;text-align:center}
h1{font-size:17px;margin:0 0 6px}
p{font-size:12.5px;color:var(--sub);margin:0 0 18px;line-height:1.5}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font-size:14px}
button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
button:hover{background:var(--accent-2)}
.err{color:var(--err);font-size:12px;margin-top:9px;min-height:16px}
</style></head><body>

<script>
var B=JSON.parse(document.getElementById('blob').textContent), KEY='lia_archive_pw';
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function dec(pw){
  var kb=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(B.salt),iterations:B.iter,hash:'SHA-256'},kb,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(B.iv)},k,b64(B.ct)));
}
async function openDoc(pw,save){var html=await dec(pw);if(save){try{localStorage.setItem(KEY,pw)}catch(e){}}document.open();document.write(html);document.close();}
document.getElementById('go').onclick=async function(){
  try{await openDoc(document.getElementById('pw').value,true);}
  catch(e){document.getElementById('err').textContent='비밀번호가 올바르지 않습니다.';}
};
(async function(){var s=null;try{s=localStorage.getItem(KEY)}catch(e){}
  if(s){document.getElementById('gload').style.display='';try{await openDoc(s,false);}catch(e){try{localStorage.removeItem(KEY)}catch(_){}location.reload();}}
  else{document.getElementById('gbox').style.display='';document.getElementById('pw').focus();}
})();
</script></body></html>
